[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --cov=handlers
    --cov=domain
    --cov=infrastructure
    --cov-report=term-missing
    --cov-report=html
    # Current measured coverage is ~69%. The gate is set slightly below that
    # to prevent regressions; raising it requires adding tests for the
    # low-coverage core modules (scte35_encoder, signal_processor,
    # rule_evaluator, esam_xml_parser).
    --cov-fail-under=65
markers =
    unit: Unit tests
    integration: Integration tests
    property: Property-based tests
